[providers.php]
# Membuka ekstensi yang dibutuhkan Laravel
libs = ["libzip", "postgresql", "mysql", "sqlite", "redis"]

[phases.build]
# Menginstall depedensi composer dan meng-compile Vite
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci && npm run build"
]

[start]
# Menjalankan PHP production server bawaan / Laravel Octane / Nginx
# Kita gunakan default PHP CLI server yang diarahkan ke public/index.php
cmd = "php -S 0.0.0.0:${PORT:-8080} -t public"
