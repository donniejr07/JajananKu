<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->

            darkMode: "class",
            theme: {
                extend: {

                            "secondary": "#006c49",

                            "secondary-fixed": "#6ffbbe",
                            "surface-container": "#f0edef",
                            "on-primary-fixed-variant": "#3f465c",
                            "inverse-surface": "#303032",

                            "inverse-primary": "#bec6e0",
                            "tertiary": "#000000",
                            "surface-bright": "#fcf8fa",
                            "on-tertiary-container": "#75859d",
                            "on-surface": "#1b1b1d",
                            "secondary-fixed-dim": "#4edea3",
                            "on-error": "#ffffff",
                            "on-background": "#1b1b1d",
                            "surface-tint": "#565e74",

                            "inverse-on-surface": "#f3f0f2",
                            "primary-container": "#131b2e",
                            "surface": "#fcf8fa",

                            "surface-dim": "#dcd9db",

                            "tertiary-fixed-dim": "#b7c8e1",
                            "primary": "#000000",

                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom ambient shadow for the main card as per design system Level 1 */
        .ambient-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<!-- Suppressing navigation shell as Login is a linear/transactional page -->
<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex items-center justify-center p-stack-lg relative overflow-hidden">
<!-- Subtle background decoration to avoid stark emptiness while maintaining minimalism -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-surface-container-high to-transparent"></div>
</div>
<!-- Main Login Card (Level 1 Elevation) -->
<div class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl ambient-shadow p-stack-lg flex flex-col gap-stack-lg z-10 transition-shadow duration-300 hover:shadow-md hover:border-outline">
<!-- Header -->
<div class="flex flex-col items-center justify-center text-center space-y-stack-sm pt-stack-sm">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">JajananKu</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Secure access to your personal finances.</p>
</div>
<!-- Form Container -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email/Username Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email or Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px] pointer-events-none">mail</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="email" name="email" placeholder="john.doe@example.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-2 mb-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary focus:ring-offset-background transition-colors cursor-pointer bg-surface-container-lowest" name="remember" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors underline-offset-4 hover:underline" href="#">Forgot password?</a>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-3 rounded-lg hover:bg-on-primary-fixed-variant focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background transition-all flex justify-center items-center gap-2 mt-stack-sm shadow-sm active:scale-[0.98]" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="pt-stack-sm border-t border-outline-variant/30 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-title-lg text-title-lg text-secondary hover:text-on-secondary-container transition-colors underline-offset-4 hover:underline ml-1" href="#">Register here</a>
</p>
</div>
</div>
</body></html>
