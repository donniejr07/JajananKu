<style>

            transition: all 0.2s ease-in-out;

<body class="min-h-screen flex items-center justify-center p-4">
<!-- Register Card -->
<main class="w-full max-w-md">
<div class="glass-card rounded-xl p-8">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">JajananKu</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create an account to manage your finances.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="name">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="form-input block w-full pl-10 pr-3 py-2 border border-transparent rounded-lg text-on-surface font-body-md text-body-md focus:outline-none" id="name" name="name" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email Address -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="form-input block w-full pl-10 pr-3 py-2 border border-transparent rounded-lg text-on-surface font-body-md text-body-md focus:outline-none" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="form-input block w-full pl-10 pr-3 py-2 border border-transparent rounded-lg text-on-surface font-body-md text-body-md focus:outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="confirm_password">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock_reset</span>
</div>
<input class="form-input block w-full pl-10 pr-3 py-2 border border-transparent rounded-lg text-on-surface font-body-md text-body-md focus:outline-none" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded border-outline-variant text-[#10B981] focus:ring-[#10B981] bg-[#F1F5F9]" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">I agree to the <a class="font-medium text-primary hover:underline" href="#">Terms of Service</a> and <a class="font-medium text-primary hover:underline" href="#">Privacy Policy</a>.</label>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="btn-primary w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-title-lg text-title-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0F172A]" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Back to Login -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-medium text-primary hover:underline transition-colors" href="#">Sign in here</a>
</p>
</div>
</div>
